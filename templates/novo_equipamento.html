<form action="/cadastrar_equipamento" method="POST">
    <label>Tipo de Equipamento:</label>
    <input type="text" name="tipo" placeholder="Ex: Notebook, Monitor" required>

    <label>Marca/Modelo:</label>
    <input type="text" name="modelo" placeholder="Ex: Dell Latitude" required>

    <label>Número de Série:</label>
    <input type="text" name="serie" placeholder="Ex: ABC123XYZ" required>

    <button type="submit">Cadastrar Equipamento</button>
</form>
